name: Budget-Notebook CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: |
            express-back-end/package-lock.json
            react-front-end/package-lock.json

      - name: Install backend dependencies
        working-directory: express-back-end
        run: npm ci

      - name: Install frontend dependencies
        working-directory: react-front-end
        run: npm ci

      - name: Build frontend
        working-directory: react-front-end
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t budget-notebook-backend ./express-back-end

      - name: Build frontend Docker image
        run: docker build -t budget-notebook-frontend ./react-front-end

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./express-back-end
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/budget-notebook-backend:latest
            ghcr.io/${{ github.repository_owner }}/budget-notebook-backend:${{ github.sha }}

      - name: Build and push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./react-front-end
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/budget-notebook-frontend:latest
            ghcr.io/${{ github.repository_owner }}/budget-notebook-frontend:${{ github.sha }}
